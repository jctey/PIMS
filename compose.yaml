services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pims_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - mysql

  nginx:
    image: nginx:alpine
    container_name: pims_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  mysql:
    image: mysql:8.0
    container_name: pims_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: pims
      MYSQL_USER: pims
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - pims_mysql_data:/var/lib/mysql

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pims_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://nginx:80
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - nginx

volumes:
  pims_mysql_data:
  frontend_node_modules:
